<!doctype html>
<html lang="uk">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Список справ</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="styles.css">
</head>
<body>
   <main class="app">
      <h1>
         <svg class="icon title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18h18l-1.5-10-4.5 4-3-6-3 6-4.5-4z"/>
         </svg>
         Список справ
      </h1>

      <form id="todo-form">
         <input id="todo-input" type="text" placeholder="Нова справа..." autocomplete="off">
         <button type="submit" class="add-btn" aria-label="Додати">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
               <path d="M12 5v14M5 12h14"/>
            </svg>
         </button>
      </form>

      <ul id="todo-list"></ul>
      <p id="counter"></p>
   </main>

   <script src="index.js"></script>
</body>
</html>
